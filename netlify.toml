[build]
  command = "npm run generate"
  # Nuxt switches to its netlify-static preset on Netlify, which writes to dist (locally it is .output/public).
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Optional: serve the Rough Day page at the root of a separate domain (e.g. roughday.game).
# Set ROUGH_DAY_HOSTS in Netlify (Site configuration > Environment variables), comma separated,
# e.g. roughday.game,www.roughday.game. See netlify/edge-functions/rough-day-host.ts.
[[edge_functions]]
  path = "/"
  function = "rough-day-host"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/games/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/app-ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
